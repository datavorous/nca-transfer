[project]
name = "sampleeff-shared"
version = "0.1.0"
description = "Shared transformer and checkpoint utilities"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.2.6",
  "torch==2.8.0",
  "transformers==4.53.0",
  "wandb==0.20.1",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sampleeff_shared"
