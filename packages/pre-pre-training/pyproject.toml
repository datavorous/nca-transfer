[project]
name = "sampleeff-nca-pre-pretraining"
version = "0.1.0"
description = "Pack NCA trajectories and pre-pre-train the original transformer"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "sampleeff-shared==0.1.0",
  "sampleeff-nca==0.1.0",
]

[tool.uv.sources]
sampleeff-shared = { workspace = true }
sampleeff-nca = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sampleeff_nca_pretraining"
