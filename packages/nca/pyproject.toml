[project]
name = "sampleeff-nca"
version = "0.1.0"
description = "Standalone neural cellular automata trajectory generator"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "flax==0.11.2",
  "jax==0.6.2",
  "matplotlib==3.10.3",
  "numpy==2.2.6",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nca"
